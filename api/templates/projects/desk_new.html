{% extends "projects/base.html" %}{% block heading %}Start Desk Research{% endblock %}{% block content %}<div class="breadcrumb"><a href="/ui/projects/{{ view.project_id }}">← {{ view.project_name }}</a></div><section class="form-card"><h2>Research brief</h2>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/ui/projects/{{ view.project_id }}/desk"><label>Title<input name="title" required value="{{ view.project_name }}"></label><label>Business question<textarea name="business_question" required></textarea></label><label>Objectives<textarea name="objectives" placeholder="One objective per line"></textarea></label><label>Geography<input name="geography"></label><label>Market<input name="market"></label><label>Timeframe<input name="timeframe"></label><input type="hidden" name="language" value="en"><button class="button" type="submit">Start Desk Research</button></form></section>{% endblock %}
