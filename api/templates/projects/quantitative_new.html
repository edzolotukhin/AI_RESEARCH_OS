{% extends "projects/base.html" %}{% block heading %}Start Quantitative Research{% endblock %}{% block content %}<div class="breadcrumb"><a href="/ui/projects/{{ view.project_id }}">← {{ view.project_name }}</a></div><section class="form-card"><h2>Create project-bound study</h2><p class="muted">The study and workflow retain independent identities inside this Project.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/ui/projects/{{ view.project_id }}/quantitative"><label>Study title<input name="title" required value="{{ view.project_name }} — Quantitative"></label><label>Description<textarea name="description"></textarea></label><input type="hidden" name="submission_key" value="{{ submission_key }}"><button class="button" type="submit">Create Quantitative Study</button></form></section>{% endblock %}
