{% extends "projects/base.html" %}{% block content %}<section class="project-card"><h1>Pilot users</h1>{% for user in users %}<div><strong>{{ user.display_name }}</strong> · {{ user.email }} · {{ user.status.value }}<form method="post" action="/ui/admin/users/{{ user.id }}/{{ 'disable' if user.status.value == 'active' else 'enable' }}"><button>{{ 'Disable' if user.status.value == 'active' else 'Enable' }}</button></form></div>{% endfor %}<h2>Create user</h2><form method="post"><label>Email<input name="email" type="email" required></label><label>Display name<input name="display_name" required></label><label>Temporary password<input name="password" type="password" minlength="12" required></label><button>Create user</button></form></section>{% endblock %}
