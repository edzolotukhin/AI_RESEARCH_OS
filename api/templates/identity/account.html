{% extends "projects/base.html" %}{% block heading %}Account{% endblock %}{% block header_action %}{% endblock %}{% block content %}<section class="form-card form-card-focused"><p class="eyebrow">SIGNED IN USER</p><h2>{{ user.display_name }}</h2><p class="muted">{{ user.email }}</p>{% if password_error %}<div class="alert" role="alert">{{ password_error }}</div>{% endif %}<h3>Змінити пароль</h3><form method="post" action="/ui/account/password"><label>Поточний пароль<input name="current_password" type="password" autocomplete="current-password" required></label><label>Новий пароль<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button class="button" type="submit">Змінити пароль</button></form><form method="post" action="/ui/logout"><button class="button" type="submit">Sign out</button></form></section>{% endblock %}
