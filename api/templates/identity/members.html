{% extends "projects/base.html" %}{% block content %}<section class="project-card"><h1>Project members</h1>{% for item in members %}<div><strong>{{ item.user.display_name }}</strong> · {{ item.membership.role.value }}<form method="post" action="/ui/projects/{{ project_id }}/members/{{ item.user.id }}/role"><select name="role"><option>OWNER</option><option>RESEARCHER</option><option>VIEWER</option></select><button>Change role</button></form><form method="post" action="/ui/projects/{{ project_id }}/members/{{ item.user.id }}/remove"><button>Remove</button></form></div>{% endfor %}<h2>Add existing pilot user</h2><form method="post"><select name="user_id">{% for user in users %}<option value="{{ user.id }}">{{ user.display_name }} ({{ user.email }})</option>{% endfor %}</select><select name="role"><option>RESEARCHER</option><option>VIEWER</option></select><button>Add member</button></form></section>{% endblock %}
