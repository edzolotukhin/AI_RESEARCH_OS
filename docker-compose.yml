x-live-research-env: &live-research-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-5}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
  EVIDENCE_EXTRACTOR: ${EVIDENCE_EXTRACTOR:-llm}
  ANALYSIS_ENGINE: ${ANALYSIS_ENGINE:-llm}
  REPORT_ENGINE: ${REPORT_ENGINE:-llm}
  REVIEW_ENGINE: ${REVIEW_ENGINE:-llm}
  DETERMINISTIC_PLANNER: ${DETERMINISTIC_PLANNER:-0}
  DETERMINISTIC_STAGE_EXECUTORS: ${DETERMINISTIC_STAGE_EXECUTORS:-0}
  PLANNER_REASONING_EFFORT: ${PLANNER_REASONING_EFFORT:-minimal}
  PLANNER_MAX_OUTPUT_TOKENS: ${PLANNER_MAX_OUTPUT_TOKENS:-8192}
  PLANNER_SEMANTIC_MAX_ATTEMPTS: ${PLANNER_SEMANTIC_MAX_ATTEMPTS:-3}
  ANALYSIS_REASONING_EFFORT: ${ANALYSIS_REASONING_EFFORT:-minimal}
  ANALYSIS_MAX_OUTPUT_TOKENS: ${ANALYSIS_MAX_OUTPUT_TOKENS:-8192}
  SOURCE_MIN_SUCCESSFUL_SOURCES: ${SOURCE_MIN_SUCCESSFUL_SOURCES:-3}
  SOURCE_MIN_INFORMATION_NEED_COVERAGE_RATIO: ${SOURCE_MIN_INFORMATION_NEED_COVERAGE_RATIO:-1.0}
  SOURCE_MAX_SOURCES_PER_RUN: ${SOURCE_MAX_SOURCES_PER_RUN:-30}
  SOURCE_ACQUISITION_MAX_SECONDS: ${SOURCE_ACQUISITION_MAX_SECONDS:-900}
  REPORT_REASONING_EFFORT: ${REPORT_REASONING_EFFORT:-minimal}
  REPORT_MAX_OUTPUT_TOKENS: ${REPORT_MAX_OUTPUT_TOKENS:-8192}
  REVIEW_REASONING_EFFORT: ${REVIEW_REASONING_EFFORT:-minimal}
  REVIEW_MAX_OUTPUT_TOKENS: ${REVIEW_MAX_OUTPUT_TOKENS:-4096}
  REVIEW_STRUCTURED_OUTPUT_MAX_ATTEMPTS: ${REVIEW_STRUCTURED_OUTPUT_MAX_ATTEMPTS:-3}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_research_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_research_os
      POSTGRES_USER: ai_research_os
      POSTGRES_PASSWORD: ai_research_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_research_os -d ai_research_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ai_research_os_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PERSISTENCE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://ai_research_os:ai_research_os_dev@postgres:5432/ai_research_os
      PROJECTS_ROOT: /tmp/projects
      <<: *live-research-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    container_name: ai_research_os_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PERSISTENCE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://ai_research_os:ai_research_os_dev@postgres:5432/ai_research_os
      PROJECTS_ROOT: /tmp/projects
      WORKER_LEASE_DURATION_SECONDS: "30"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "10"
      WORKER_POLL_INTERVAL_SECONDS: "1"
      <<: *live-research-env
    command: ["python", "-m", "worker.main"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -m worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
