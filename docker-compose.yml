services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_research_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_research_os
      POSTGRES_USER: ai_research_os
      POSTGRES_PASSWORD: ai_research_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_research_os -d ai_research_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
