name: Recovery 2 real research E2E

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Only the approved integration branch may be executed"
        required: true
        type: string
        default: "codex/r1-temporal-integration"
      source_sha:
        description: "Pinned, reviewed integration commit"
        required: true
        type: string
        default: "89bf632027bba0b3563560c42909b40afe42ee06"
      run_real_e2e:
        description: "Explicitly authorize this staging-only provider run"
        required: true
        type: boolean
        default: false
      infrastructure_smoke:
        description: "Run only isolated PostgreSQL/migration/API/Worker smoke checks"
        required: true
        type: boolean
        default: false
      pdf_diagnostics:
        description: "Run only the isolated PDF acceptance diagnostic"
        required: true
        type: boolean
        default: false
      max_seconds:
        description: "Hard wall-clock limit for the research run"
        required: true
        default: "1800"
      max_llm_calls:
        description: "Application LLM call cap"
        required: true
        default: "24"
      max_sources:
        description: "Application source cap"
        required: true
        default: "12"
      max_tokens:
        description: "Per-call output token cap"
        required: true
        default: "4096"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPENAI_API_KEY: ${{ secrets.RECOVERY2_OPENAI_API_KEY }}
      SEARCH_API_KEY: ${{ secrets.RECOVERY2_SEARCH_API_KEY }}
      RUN_REAL_E2E: ${{ inputs.run_real_e2e }}
      INFRASTRUCTURE_SMOKE: ${{ inputs.infrastructure_smoke }}
      PDF_DIAGNOSTICS: ${{ inputs.pdf_diagnostics }}
      E2E_MAX_SECONDS: ${{ inputs.max_seconds }}
      LLM_MAX_CALLS_PER_RUN: ${{ inputs.max_llm_calls }}
      SOURCE_MAX_SOURCES_PER_RUN: ${{ inputs.max_sources }}
      LLM_MAX_TOKENS: ${{ inputs.max_tokens }}
    steps:
      - name: Validate all execution mode combinations
        shell: bash
        run: |
          set -euo pipefail
          accepted=0
          rejected=0
          for real in true false; do
            for smoke in true false; do
              for pdf in true false; do
                active=0
                [ "$real" = true ] && active=$((active + 1))
                [ "$smoke" = true ] && active=$((active + 1))
                [ "$pdf" = true ] && active=$((active + 1))
                if [ "$active" -eq 1 ]; then
                  accepted=$((accepted + 1))
                else
                  rejected=$((rejected + 1))
                fi
              done
            done
          done
          test "$accepted" -eq 3
          test "$rejected" -eq 5
          echo "Validated all 8 mode combinations: 3 accepted, 5 rejected."
      - name: Validate execution authorization before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = "codex/r1-temporal-integration"
          test "$SOURCE_SHA" = "89bf632027bba0b3563560c42909b40afe42ee06"
          active_modes=0
          [ "$RUN_REAL_E2E" = true ] && active_modes=$((active_modes + 1))
          [ "$INFRASTRUCTURE_SMOKE" = true ] && active_modes=$((active_modes + 1))
          [ "$PDF_DIAGNOSTICS" = true ] && active_modes=$((active_modes + 1))
          test "$active_modes" -eq 1
          if [ "$RUN_REAL_E2E" = true ]; then
            test -n "$OPENAI_API_KEY"
            test -n "$SEARCH_API_KEY"
          fi
          test "$E2E_MAX_SECONDS" -gt 0
          test "$LLM_MAX_CALLS_PER_RUN" -gt 0
          test "$SOURCE_MAX_SOURCES_PER_RUN" -gt 0
          test "$LLM_MAX_TOKENS" -gt 0

  real-e2e:
    needs: preflight
    if: inputs.pdf_diagnostics != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      POSTGRES_USER: ai_research_os
      POSTGRES_PASSWORD: ai_research_os_ci
      POSTGRES_DB: ai_research_os
      OPENAI_API_KEY: ${{ secrets.RECOVERY2_OPENAI_API_KEY }}
      SEARCH_API_KEY: ${{ secrets.RECOVERY2_SEARCH_API_KEY }}
      RUN_REAL_E2E: ${{ inputs.run_real_e2e }}
      INFRASTRUCTURE_SMOKE: ${{ inputs.infrastructure_smoke }}
      PDF_DIAGNOSTICS: ${{ inputs.pdf_diagnostics }}
      E2E_MAX_SECONDS: ${{ inputs.max_seconds }}
      LLM_MAX_CALLS_PER_RUN: ${{ inputs.max_llm_calls }}
      SOURCE_MAX_SOURCES_PER_RUN: ${{ inputs.max_sources }}
      LLM_MAX_TOKENS: ${{ inputs.max_tokens }}
      EVIDENCE_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
      SUFFICIENCY_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
      ANALYSIS_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
      REPORT_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}
      REVIEW_MAX_CALLS: ${{ inputs.max_llm_calls }}
      PLANNER_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      EVIDENCE_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      SUFFICIENCY_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      ANALYSIS_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      REPORT_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      REVIEW_MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens }}
      SEARCH_PROVIDER: tavily
      EVIDENCE_EXTRACTOR: llm
      ANALYSIS_ENGINE: llm
      REPORT_ENGINE: llm
      REVIEW_ENGINE: llm
      DETERMINISTIC_PLANNER: "0"
      DETERMINISTIC_STAGE_EXECUTORS: "0"
      PERSISTENCE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg://ai_research_os:ai_research_os_ci@127.0.0.1:5432/ai_research_os
      E2E_API_BASE: http://127.0.0.1:8000
      E2E_OUTPUT_DIR: real_e2e_artifacts

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = "codex/r1-temporal-integration"
          test "$SOURCE_SHA" = "89bf632027bba0b3563560c42909b40afe42ee06"
          active_modes=0
          [ "$RUN_REAL_E2E" = true ] && active_modes=$((active_modes + 1))
          [ "$INFRASTRUCTURE_SMOKE" = true ] && active_modes=$((active_modes + 1))
          [ "$PDF_DIAGNOSTICS" = true ] && active_modes=$((active_modes + 1))
          test "$active_modes" -eq 1
          if [ "$RUN_REAL_E2E" = true ]; then
            test -n "$OPENAI_API_KEY"
            test -n "$SEARCH_API_KEY"
          fi
          test "$E2E_MAX_SECONDS" -gt 0
          test "$LLM_MAX_CALLS_PER_RUN" -gt 0
          test "$SOURCE_MAX_SOURCES_PER_RUN" -gt 0
          test "$LLM_MAX_TOKENS" -gt 0
      - name: Apply schema
        run: |
          mkdir -p real_e2e_artifacts
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml up -d postgres
          postgres_id="$(docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml ps -q postgres)"
          test -n "$postgres_id"
          for attempt in {1..60}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' "$postgres_id" | grep -qx healthy
          python -m alembic upgrade head
      - name: Start isolated API and Worker
        run: |
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml up -d --build api worker
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "API did not become ready" >&2
          exit 1
      - name: Register disposable API key
        if: inputs.infrastructure_smoke == true || inputs.run_real_e2e == true
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f api-key.out' EXIT
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml run --rm api python -m tools.create_api_key --name recovery2-ci-key > api-key.out
          API_KEY="$(awk '/^plaintext_key/{getline; print; exit}' api-key.out)"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"
          echo "E2E_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          rm -f api-key.out
      - name: Verify application imports in API image
        if: inputs.infrastructure_smoke == true || inputs.run_real_e2e == true
        run: |
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml \
            exec -T api python -c "import application.composition_root; import tools.real_research_e2e"
      - name: Run real provider E2E
        if: inputs.run_real_e2e == true
        shell: bash
        run: |
          set +e
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml exec -T \
            -e RUN_REAL_E2E="$RUN_REAL_E2E" \
            -e E2E_API_BASE="http://127.0.0.1:8000" \
            -e E2E_API_KEY="$E2E_API_KEY" \
            -e E2E_MAX_SECONDS="$E2E_MAX_SECONDS" \
            -e LLM_MAX_CALLS_PER_RUN="$LLM_MAX_CALLS_PER_RUN" \
            -e SOURCE_MAX_SOURCES_PER_RUN="$SOURCE_MAX_SOURCES_PER_RUN" \
            -e LLM_MAX_TOKENS="$LLM_MAX_TOKENS" \
            -e E2E_PREPARE_APPROVED_PROJECT=true \
            -e E2E_OUTPUT_DIR=/tmp/real_e2e_artifacts \
            api python -m tools.real_research_e2e
          status=$?
          mkdir -p real_e2e_artifacts
          docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml cp \
            api:/tmp/real_e2e_artifacts/. real_e2e_artifacts/ || true
          exit "$status"
      - name: Collect service logs
        if: always()
        run: docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml logs --no-color --tail=400 > real_e2e_artifacts/services.log || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery2-real-research-e2e
          path: real_e2e_artifacts/
          if-no-files-found: warn
      - name: Cleanup disposable runtime
        if: always()
        run: docker compose -p recovery2-e2e -f docker-compose.yml -f docker-compose.recovery2-e2e.yml down --volumes --remove-orphans

  pdf-diagnostics:
    needs: preflight
    if: inputs.pdf_diagnostics == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_research_os
          POSTGRES_PASSWORD: ai_research_os_dev
          POSTGRES_DB: ai_research_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_research_os -d ai_research_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: ai_research_os
      POSTGRES_PASSWORD: ai_research_os_dev
      POSTGRES_DB: ai_research_os
      POSTGRES_TEST_DB: ai_research_os_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      PERSISTENCE_BACKEND: postgresql
      PDF_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      CI: "true"
      POSTGRESQL_INTEGRATION_TESTS: "1"
      POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
      CI_POSTGRESQL_TEST_DATABASE: ai_research_os_test
      DATABASE_URL_TEST: postgresql+psycopg://ai_research_os:ai_research_os_dev@localhost:5432/ai_research_os_test
      DATABASE_URL: postgresql+psycopg://ai_research_os:ai_research_os_dev@localhost:5432/ai_research_os_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install diagnostic dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install pypdf==6.10.0
          npm ci --prefix infrastructure/documents/pptx_runtime --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify imports in API image
        run: |
          docker build --quiet -t recovery2-diagnostic-api . >/dev/null
          docker run --rm recovery2-diagnostic-api python -c \
            "import application.composition_root; import tools.real_research_e2e; print('container import smoke: PASS')"
      - name: Apply isolated test schema
        env:
          DATABASE_URL: postgresql+psycopg://ai_research_os:ai_research_os_dev@localhost:5432/ai_research_os_test
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg import sql
          conn = psycopg.connect(host="localhost", port=5432, user="ai_research_os", password="ai_research_os_dev", dbname="postgres", autocommit=True)
          with conn.cursor() as cur:
              cur.execute(sql.SQL("CREATE DATABASE {} ").format(sql.Identifier("ai_research_os_test")))
          conn.close()
          PY
          python -m alembic upgrade head
      - name: Capture PDF bytes before assertion
        run: |
          mkdir -p pdf_diagnostics
          cat > sitecustomize.py <<'PY'
          from pathlib import Path
          from infrastructure.persistence.postgresql.repositories.postgresql_pdf_store import PostgreSQLPdfStore
          original = PostgreSQLPdfStore.complete
          def capture(self, record, data):
              if record.format == "PDF":
                  Path("pdf_diagnostics/report.pdf").write_bytes(data)
              return original(self, record, data)
          PostgreSQLPdfStore.complete = capture
          PY
      - name: Require integration test environment
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests(); print('integration test environment: PASS')"
      - name: Run only PDF acceptance test
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m unittest -v tests.integration.postgresql.test_integrated_research_acceptance.IntegratedResearchAcceptanceTests.test_full_research_production_container 2>&1 | tee pdf_diagnostics/test.log
          status=${PIPESTATUS[0]}
          if ! grep -q 'Ran 1 test' pdf_diagnostics/test.log || grep -q 'skipped=1' pdf_diagnostics/test.log || grep -q 'Ran 0 tests' pdf_diagnostics/test.log; then
            echo "Diagnostic target did not execute exactly one test" >> pdf_diagnostics/test.log
            status=1
          fi
          if [ -f pdf_diagnostics/report.pdf ]; then
            python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          expected = ("-50 persons", "-5 percent", "-5,263158 percent", "-100 persons", "-10 percent")
          text = "\n".join(page.extract_text() or "" for page in PdfReader("pdf_diagnostics/report.pdf").pages)
          Path("pdf_diagnostics/extracted.txt").write_text(text, encoding="utf-8")
          Path("pdf_diagnostics/missing_values.txt").write_text("\n".join(v for v in expected if v not in text) + "\n", encoding="utf-8")
          PY
          else
            echo "PDF was not persisted before assertion" > pdf_diagnostics/missing_values.txt
          fi
          exit "$status"
      - name: Upload PDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery2-pdf-diagnostics
          path: pdf_diagnostics/
          if-no-files-found: warn
