name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_research_os
          POSTGRES_PASSWORD: ai_research_os_dev
          POSTGRES_DB: ai_research_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_research_os -d ai_research_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: ai_research_os
      POSTGRES_PASSWORD: ai_research_os_dev
      POSTGRES_DB: ai_research_os
      POSTGRES_TEST_DB: ai_research_os_test
      POSTGRES_MIGRATION_TEST_DB: ai_research_os_migration_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install offline PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install pypdf==6.10.0
          echo "PDF_FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" >> "$GITHUB_ENV"

      - name: Set up pinned PPTX Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install pinned PPTX renderer and run synthetic qualification
        run: |
          npm ci --prefix infrastructure/documents/pptx_runtime --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix prototypes/prf06f_pptx_qualification --omit=dev --ignore-scripts --no-audit --no-fund
          node prototypes/prf06f_pptx_qualification/qualify.mjs prototypes/prf06f_pptx_qualification/runs
          node prototypes/prf06f_pptx_qualification/qualify.mjs --self-test-limits
          python -m unittest prototypes.prf06f_pptx_qualification.validate -v

      - name: Check whitespace and conflict markers
        shell: bash
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Checking pull request commit range."
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            echo "Checking push commit range."
          fi

          echo "Base: ${BASE}"
          echo "Head: ${HEAD}"

          if ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            echo "Head commit is not available in the local repository." >&2
            exit 1
          fi

          if [ "$BASE" = "$ZERO_SHA" ]; then
            echo "No previous ref (initial push); checking HEAD commit only."
            git show --check --format="" "$HEAD"
            exit 0
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base commit not available locally; attempting fetch."
            if ! git fetch --no-tags origin "${BASE}"; then
              echo "Could not fetch base commit; checking HEAD commit only." >&2
              git show --check --format="" "$HEAD"
              exit 0
            fi
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base commit still unavailable after fetch; checking HEAD commit only." >&2
            git show --check --format="" "$HEAD"
            exit 0
          fi

          if [ "$BASE" = "$HEAD" ]; then
            echo "Empty commit range; nothing to check."
            exit 0
          fi

          git diff --check "${BASE}..${HEAD}"

      - name: Ensure test database exists
        run: |
          python <<'PY'
          import os
          import sys

          import psycopg

          user = os.environ["POSTGRES_USER"]
          password = os.environ["POSTGRES_PASSWORD"]
          main_db = os.environ["POSTGRES_DB"]
          test_db = os.environ["POSTGRES_TEST_DB"]
          host = os.environ["POSTGRES_HOST"]
          port = os.environ["POSTGRES_PORT"]

          migration_db = os.environ["POSTGRES_MIGRATION_TEST_DB"]
          if (
              host not in {"localhost", "127.0.0.1"}
              or port != "5432"
              or user != "ai_research_os"
              or password != "ai_research_os_dev"
              or main_db != "ai_research_os"
              or test_db != "ai_research_os_test"
              or migration_db != "ai_research_os_migration_test"
              or len({main_db, test_db, migration_db}) != 3
          ):
              sys.exit(
                  "Refusing to create databases outside the isolated CI PostgreSQL service."
              )

          conn = psycopg.connect(
              host=host,
              port=port,
              user=user,
              password=password,
              dbname=main_db,
              autocommit=True,
          )
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  if cur.fetchone()[0] != main_db:
                      sys.exit("Refusing an unexpected PostgreSQL database")
                  for name in (test_db, migration_db):
                      cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (name,))
                      if cur.fetchone() is not None:
                          sys.exit(f"Refusing to reuse existing database: {name}")
                      cur.execute(
                          psycopg.sql.SQL("CREATE DATABASE {}").format(
                              psycopg.sql.Identifier(name)
                          )
                      )
          finally:
              conn.close()
          PY

      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Unit tests
        run: python run_tests.py

      - name: PostgreSQL repository contract tests
        env:
          POSTGRESQL_INTEGRATION_TESTS: "1"
          POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
          CI_POSTGRESQL_TEST_DATABASE: ${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests()"
          python -W error::ResourceWarning -m unittest \
            tests.application.ports.test_postgresql_repository_contracts -v

      - name: PostgreSQL integration tests
        env:
          POSTGRESQL_INTEGRATION_TESTS: "1"
          POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
          CI_POSTGRESQL_TEST_DATABASE: ${{ env.POSTGRES_TEST_DB }}
          CI_POSTGRESQL_MIGRATION_DATABASE: ${{ env.POSTGRES_MIGRATION_TEST_DB }}
          DATABASE_URL_MIGRATION_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_MIGRATION_TEST_DB }}
          DATABASE_URL_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests()"
          python -W error::ResourceWarning -m unittest discover \
            -s tests/integration/postgresql -p "test_*.py" -v

      - name: API tests
        run: >-
          python -W error::ResourceWarning -m unittest discover
          -s tests/api -p "test_*.py" -v

      - name: PostgreSQL API integration tests
        env:
          POSTGRESQL_INTEGRATION_TESTS: "1"
          POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
          CI_POSTGRESQL_TEST_DATABASE: ${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests()"
          python -W error::ResourceWarning -m unittest discover \
            -s tests/integration/api -p "test_*.py" -v

      - name: Worker integration tests
        env:
          POSTGRESQL_INTEGRATION_TESTS: "1"
          POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
          CI_POSTGRESQL_TEST_DATABASE: ${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests()"
          python -W error::ResourceWarning -m unittest \
            tests.integration.postgresql.test_worker_execution \
            tests.integration.postgresql.test_claim_matrix \
            tests.application.execution.test_lease_guards \
            tests.integration.worker.test_process_crash_recovery -v

      - name: External orchestration integration tests
        env:
          POSTGRESQL_INTEGRATION_TESTS: "1"
          POSTGRESQL_DISPOSABLE_TEST_DATABASE: "1"
          CI_POSTGRESQL_TEST_DATABASE: ${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL_TEST: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
          DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_TEST_DB }}
        run: |
          python -c "from tests.integration.postgresql.helpers import require_integration_tests; require_integration_tests()"
          python -W error::ResourceWarning -m unittest \
            tests.integration.api.test_external_orchestration -v

      - name: OpenAPI smoke test
        run: >-
          python -c "from tests.api.helpers import build_test_client; c,_=build_test_client(); assert c.get('/openapi.json').status_code==200"

      - name: Docker image build smoke
        run: docker build .
