services:
  n8n:
    image: n8nio/n8n:1.98.1
    container_name: ai_research_os_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      AI_RESEARCH_OS_API_URL: http://api:8000
      AI_RESEARCH_OS_API_KEY: ${AI_RESEARCH_OS_API_KEY}
      N8N_POLL_INTERVAL_SECONDS: ${N8N_POLL_INTERVAL_SECONDS:-3}
      N8N_MAX_POLL_ATTEMPTS: ${N8N_MAX_POLL_ATTEMPTS:-120}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_started

volumes:
  n8n_data:
